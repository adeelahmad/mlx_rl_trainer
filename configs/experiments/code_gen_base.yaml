# Production-ready configuration for a code generation task using GRPO.
# This file is validated against the pydantic schemas in src/mlx_rl_trainer/core/config.py.

trainer:
  algorithm: "grpo"
  output_dir: "./outputs/code_gen_run_01"
  num_training_steps: 80000
  learning_rate: 3e-5 # CORRECTED: Lowered to a safe value for fine-tuning.
  ppo_batch_size: 1
  num_rollout_samples: 1
  grad_accum_steps: 3
  # CORRECTED: Increased beta to prevent model collapse.
  grpo_beta: 0.01
  seed: -1

  # Dual gradients for System 1/2
  use_dual_gradients: true
  thinking_layer_start: 26
  thinking_layer_end: 36
  answer_layer_start: 21
  answer_layer_end: 30
  answer_gradient_weight: 1.5

  # SFT configuration
  use_sft_on_answer: false
  sft_mode: "all" # Recommended for System 1/2
  sft_weight: 0.1
  sft_thinking_weight: 0.1 # For 'weighted' mode
  sft_answer_weight: 1.0 # For 'weighted' mode

model:
  model_path: "/Users/adeelahmad/work/mlx_rl_trainer/outputs/model"
  ref_model_path: "/Users/adeelahmad/.cache/lm-studio/models/lmstudio-community/Qwen-4B-Thinking-2507"
  base_model_path: "/Users/adeelahmad/.cache/lm-studio/models/lmstudio-community/Qwen-4B-Thinking-2507"
  use_lora: false
  lora_rank: 16

generation:
  force_close_think_after: 96
  # ... your existing temperature settings ...

  # For structural guidance
  think_start_tag: "<think>"
  think_end_tag: "</think>"
  bias_close_think: 3.0
  bias_answer_start: 6.0
  punish_extra_think_end: -12.0
  min_think_tokens: 16
  think_end_early_bias: -10.0

  # For MCQ handling
  hard_mask_mcq_first_token: true
  mcq_letter_lift: 8.0
  mcq_ban_first_bias: -14.0
  max_think_tokens: 150

data:
  # The old JSONL paths are now replaced by the .npy path prefixes
  train_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/strat/train.jsonl"
  val_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/strat/valid.jsonl"

  # ⭐ NEW: Point to the output_prefix used in the pre-tokenization script
  # train_npy_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/strat/train_pretokenized"
  # val_npy_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/strat/valid_pretokenized"

  # Other settings remain the same
  max_prompt_len: 150
  max_gen_len: 128
  loader_type: "jsonl" # This key is now ignored but is safe to leave
  shuffle_data: true

# data:
#   train_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/judge/train.jsonl"
#   val_path: "/Users/adeelahmad/work/SiLLM-examples/helpsteer/mlx-grpo/judge/valid.jsonl"
#   max_prompt_len: 150
#   max_gen_len: 384
#   loader_type: "jsonl"
#   shuffle_data: true

# The system_prompt from your ExperimentConfig will be used automatically by the trainer.
# You don't need to specify it here unless you want to overridpe the default.

# In your config.yaml file

rewards:
  - name: "format_structure"
    weight: 0.05 # Lowered: Model seems good at structure, focus elsewhere.
    config:
      min_think_length: 20
      min_answer_length: 15
      think_length_target_min: 80
      think_length_target_max: 250
      debug_logging: true

  - name: "thinking_quality"
    weight: 0.20 # Kept moderate to encourage good reasoning.
    config:
      target_length_min: 80
      target_length_max: 250
      optimal_length_min: 100
      optimal_length_max: 200
      excessive_length_threshold: 300
      debug_logging: true

  - name: "answer_quality"
    weight: 0.30 # Increased: Focus on the quality of the final answer.
    config:
      max_penalty: 1.0
      phrase_penalty: 0.25
      debug_logging: true
  - name: "semantic_similarity"
    weight: 0.45 # Highest weight: This now controls both meaning and length.
    config:
      method: "tfidf" # Recommended for better semantic understanding.
      min_length: 10
      debug_logging: true
      apply_length_penalty: true # Renamed to apply_brevity_penalty in code.
      apply_verbosity_penalty: true # ⭐ CRITICAL: Enable the new penalty.
      verbosity_penalty_strength: 0.7 # ⭐ TUNEABLE: A strong but fair starting point.

